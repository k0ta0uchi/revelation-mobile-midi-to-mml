name: Build and release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./gui
    steps:
      # -------------------------
      # Setup
      # -------------------------
      
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install rinf
        run: cargo install rinf

      - name: Generate message code
        run: rinf message

      # -------------------------
      # Setup windows
      # -------------------------

      - name: Setup Microsoft Store Developer CLI
        uses: microsoft/setup-msstore-cli@v1
    
      # ① GitHub Secrets から PFX を復元
      - name: Decode and save PFX certificate (Windows)
        run: |
          echo "${{ secrets.PFX_BASE64 }}" > encoded_cert.txt
          certutil -decode encoded_cert.txt test_certificate.pfx

      # ② PFX を Windows にインストール
      - name: Install signing certificate
        run: Start-Process PowerShell -ArgumentList "certutil -importpfx test_certificate.pfx -p 'revelation'" -Verb RunAs

      # ③ MSIX を作成（署名付き）
      - name: Create MSIX package
        run: Start-Process PowerShell -ArgumentList "dart run msix:create --certificate-path test_certificate.pfx --certificate-password 'revelation'" -Verb RunAs

  github-release:
    runs-on: windows-latest
    permissions: write-all
    defaults:
      run:
        working-directory: ./gui
    steps:
      # -------------------------
      # Setup
      # -------------------------
      
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install rinf
        run: cargo install rinf

      - name: Generate message code
        run: rinf message

      - name: Install flutter_distributor
        run: flutter pub global activate flutter_distributor
      
      # -------------------------
      # Build
      # -------------------------

      - name: Build releases
        run: flutter_distributor release --name default

      # -------------------------
      # Release on github
      # -------------------------
      
      - name: Github release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: gui/dist/*/*
          generateReleaseNotes: true
          artifactErrorsFailBuild: true